<div class="vertex-form-widget" data-xmin="-10" data-xmax="10" data-ymin="-10" data-ymax="10"
    style="max-width:760px;margin:1rem auto"></div>

<style>
    .vertex-form-widget {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .vfw-card {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 14px;
        background: #fff;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
    }

    .vfw-title {
        font-weight: 800;
        font-size: 1.05rem;
        margin-bottom: 4px;
    }

    .vfw-sub {
        color: #6b7280;
        font-size: 0.95rem;
        margin-bottom: 10px;
    }

    .vfw-layout {
        display: grid;
        gap: 12px;
    }

    .vfw-fig {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
        max-height: 520px;
    }

    .vfw-canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1/1;
        max-height: 520px;
        touch-action: none;
    }

    .vfw-controls {
        border: 1px solid #eef2f7;
        border-radius: 12px;
        padding: 10px;
        background: #fafafa;
    }

    .vfw-controlsTop {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
    }

    .vfw-btn {
        border: 1px solid #e5e7eb;
        background: #fff;
        border-radius: 10px;
        padding: 6px 10px;
        font-weight: 750;
        cursor: pointer;
    }

    .vfw-btn:active {
        transform: translateY(1px);
    }

    .vfw-sliders {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        align-items: start;
    }

    @media (max-width:860px) {
        .vfw-sliders {
            grid-template-columns: 1fr;
        }
    }

    .vfw-row {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 8px 10px 6px;
        background: #fff;
    }

    .vfw-rowHead {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 4px;
    }

    .vfw-lbl {
        font-weight: 800;
        letter-spacing: 0.2px;
    }

    .vfw-val {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
        color: #374151;
        min-width: 64px;
        text-align: right;
    }

    .vfw-controls input[type="range"] {
        width: 100%;
        accent-color: #2c3e50;
        touch-action: none;
    }

    .vfw-readout {
        border: 1px solid #eef2f7;
        border-radius: 12px;
        padding: 10px 12px;
        background: #fafafa;
    }

    .vfw-readout ul {
        margin: 6px 0 0 18px;
        color: #374151;
    }

    .vfw-hint {
        margin-top: 8px;
        color: #6b7280;
        font-size: 0.95rem;
    }

    html.vfw-dragging,
    html.vfw-dragging * {
        -webkit-user-select: none !important;
        user-select: none !important;
        cursor: grabbing !important;
    }
</style>

<script>
    (function () {
        document.querySelectorAll(".vertex-form-widget").forEach(createWidget);

        function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
        function fmt(n) {
            const v = Math.round(n * 100) / 100;
            return String(v.toFixed(2)).replace(/\.?0+$/, "");
        }

        function createWidget(container) {
            const xmin = +(container.dataset.xmin ?? -10);
            const xmax = +(container.dataset.xmax ?? 10);
            const ymin = +(container.dataset.ymin ?? -10);
            const ymax = +(container.dataset.ymax ?? 10);

            container.innerHTML = "";

            const card = document.createElement("div");
            card.className = "vfw-card";
            card.innerHTML = `
      <div class="vfw-title">Quadratic in vertex form</div>
      <div class="vfw-sub">Move the sliders to see how <b>a</b>, <b>h</b>, and <b>k</b> affect the graph.</div>

      <div class="vfw-layout">
        <div class="vfw-fig">
          <canvas class="vfw-canvas" width="520" height="520"
            role="img"
            aria-label="Graph of a quadratic in vertex form on a fixed window from -10 to 10."></canvas>
        </div>

        <div class="vfw-controls">
          <div class="vfw-controlsTop">
            <button class="vfw-btn b-reset" type="button">Reset</button>
          </div>

          <div class="vfw-sliders">
            <div class="vfw-row">
              <div class="vfw-rowHead">
                <div class="vfw-lbl">a</div>
                <div class="vfw-val v-a">1</div>
              </div>
              <input class="s-a" type="range" min="-2" max="2" step="0.01" value="1" aria-label="a slider">
            </div>

            <div class="vfw-row">
              <div class="vfw-rowHead">
                <div class="vfw-lbl">h</div>
                <div class="vfw-val v-h">0</div>
              </div>
              <input class="s-h" type="range" min="-10" max="10" step="0.01" value="0" aria-label="h slider">
            </div>

            <div class="vfw-row">
              <div class="vfw-rowHead">
                <div class="vfw-lbl">k</div>
                <div class="vfw-val v-k">0</div>
              </div>
              <input class="s-k" type="range" min="-10" max="10" step="0.01" value="0" aria-label="k slider">
            </div>
          </div>
        </div>

        <div class="vfw-readout" aria-live="polite">
          <div style="font-weight:800;">Key facts</div>
          <ul>
            <li>Vertex: <span class="vx">(0, 0)</span></li>
            <li>Axis of symmetry: <span class="ax">x = 0</span></li>
            <li>Opens: <span class="op">up</span></li>
            <li>Shape: <span class="sh">normal</span></li>
          </ul>
          <div class="vfw-hint">
            If the parabola leaves the window, bring <b>a</b> closer to 0 or move the vertex back.
          </div>
        </div>
      </div>
    `;
            container.appendChild(card);

            const canvas = card.querySelector(".vfw-canvas");
            const ctx = canvas.getContext("2d");

            const sA = card.querySelector(".s-a");
            const sH = card.querySelector(".s-h");
            const sK = card.querySelector(".s-k");

            const vA = card.querySelector(".v-a");
            const vH = card.querySelector(".v-h");
            const vK = card.querySelector(".v-k");

            const fml = card.querySelector(".fml");
            const vx = card.querySelector(".vx");
            const ax = card.querySelector(".ax");
            const op = card.querySelector(".op");
            const sh = card.querySelector(".sh");

            const resetBtn = card.querySelector(".b-reset");

            function f(x, a, h, k) {
                const t = x - h;
                return a * t * t + k;
            }

            function setCanvasDPI() {
                const S = Math.max(260, Math.floor(canvas.getBoundingClientRect().width));
                const dpr = window.devicePixelRatio || 1;
                canvas.width = Math.floor(S * dpr);
                canvas.height = Math.floor(S * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function worldToCanvas(x, y, S) {
                const px = (x - xmin) / (xmax - xmin) * S;
                const py = S - (y - ymin) / (ymax - ymin) * S;
                return [px, py];
            }

            function drawGridAxes(S) {
                ctx.clearRect(0, 0, S, S);

                // grid
                ctx.save();
                ctx.globalAlpha = 0.10;
                ctx.lineWidth = 1;

                for (let x = Math.ceil(xmin); x <= xmax; x++) {
                    const [px] = worldToCanvas(x, 0, S);
                    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, S); ctx.stroke();
                }
                for (let y = Math.ceil(ymin); y <= ymax; y++) {
                    const [, py] = worldToCanvas(0, y, S);
                    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(S, py); ctx.stroke();
                }
                ctx.restore();

                // axes
                ctx.save();
                ctx.globalAlpha = 0.55;
                ctx.lineWidth = 2;
                const [x0] = worldToCanvas(0, 0, S);
                const [, y0] = worldToCanvas(0, 0, S);
                ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(S, y0); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, S); ctx.stroke();
                ctx.restore();

                // tick labels (minimal, inside the plot)
                ctx.save();
                ctx.globalAlpha = 0.65;
                ctx.fillStyle = "#111827";
                ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, Arial";

                for (let x = Math.ceil(xmin); x <= xmax; x++) {
                    if (x === 0) continue;
                    const [px, py] = worldToCanvas(x, 0, S);
                    ctx.fillText(String(x), px + 3, py + 3);
                }

                for (let y = Math.ceil(ymin); y <= ymax; y++) {
                    if (y === 0) continue;
                    const [px, py] = worldToCanvas(0, y, S);
                    ctx.fillText(String(y), px + 6, py - 3);
                }

                ctx.restore();
            }

            function drawParabola(a, h, k, S) {
                ctx.save();
                ctx.globalAlpha = 0.95;
                ctx.lineWidth = 3;
                ctx.beginPath();
                const steps = 900;
                for (let i = 0; i <= steps; i++) {
                    const x = xmin + (xmax - xmin) * (i / steps);
                    const y = f(x, a, h, k);
                    const [px, py] = worldToCanvas(x, y, S);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.restore();
            }

            function drawVertexAxis(h, k, S) {
                const [px, py] = worldToCanvas(h, k, S);

                // dashed axis of symmetry
                ctx.save();
                ctx.globalAlpha = 0.25;
                ctx.setLineDash([8, 8]);
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, S); ctx.stroke();
                ctx.restore();

                // vertex point
                ctx.save();
                ctx.globalAlpha = 0.95;
                ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }


            function setFormula(a, h, k) {
                const text = prettyFormulaText(a, h, k);
                fml.textContent = text; // simplest and spacing-safe
            }

            function updateReadout(a, h, k) {
                vA.textContent = fmt(a);
                vH.textContent = fmt(h);
                vK.textContent = fmt(k);

                //   setFormula(a,h,k);

                vx.textContent = `(${fmt(h)}, ${fmt(k)})`;
                ax.textContent = `x = ${fmt(h)}`;

                op.textContent = (a > 0) ? "up" : (a < 0) ? "down" : "flat (a = 0)";
                const absA = Math.abs(a);
                sh.textContent =
                    (absA === 0) ? "not a parabola" :
                        (Math.abs(absA - 1) < 1e-12) ? "normal" :
                            (absA > 1) ? "narrower" : "wider";
            }

            function read() {
                return { a: +sA.value, h: +sH.value, k: +sK.value };
            }

            function render() {
                const { a, h, k } = read();
                updateReadout(a, h, k);

                const S = Math.max(260, Math.floor(canvas.getBoundingClientRect().width));
                drawGridAxes(S);

                if (Math.abs(a) > 1e-12) {
                    drawParabola(a, h, k, S);
                } else {
                    // y = k
                    ctx.save();
                    ctx.globalAlpha = 0.95;
                    ctx.lineWidth = 3;
                    const [p1x, p1y] = worldToCanvas(xmin, k, S);
                    const [p2x, p2y] = worldToCanvas(xmax, k, S);
                    ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y); ctx.stroke();
                    ctx.restore();
                }

                drawVertexAxis(h, k, S);
                drawPlotTitle(a, h, k, S);

            }

            function prettyFormulaText(a, h, k) {
                const minus = "−";  // U+2212
                const aTxt = fmt(a);

                const inner =
                    (Math.abs(h) < 1e-12) ? "x" :
                        (h >= 0) ? `x ${minus} ${fmt(h)}` : `x ${minus} (${fmt(h)})`;

                let kPart = "";
                if (Math.abs(k) > 1e-12) {
                    kPart = (k > 0) ? ` + ${fmt(k)}` : ` ${minus} ${fmt(Math.abs(k))}`;
                }

                return `f(x) = ${aTxt}(${inner})²${kPart}`;
            }

            function drawPlotTitle(a, h, k, S) {
                const text = prettyFormulaText(a, h, k);

                ctx.save();
                ctx.font = "600 16px system-ui, -apple-system, Segoe UI, Roboto, Arial";
                ctx.textBaseline = "top";

                const pad = 10;
                const x = 10;
                const y = 10;

                const w = ctx.measureText(text).width;
                const boxW = w + pad * 2;
                const boxH = 22 + pad;

                // translucent background so it reads over the grid
                ctx.globalAlpha = 0.85;
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(x, y, boxW, boxH);

                ctx.globalAlpha = 1;
                ctx.fillStyle = "#111827";
                ctx.fillText(text, x + pad, y + 6);

                ctx.restore();
            }

            // pointer capture for "grab until mouseup"
            function attachDragAnywhere(rangeEl) {
                rangeEl.style.touchAction = "none";

                const getValueFromClientX = (clientX) => {
                    const r = rangeEl.getBoundingClientRect();
                    const min = parseFloat(rangeEl.min);
                    const max = parseFloat(rangeEl.max);

                    let t = (clientX - r.left) / r.width;
                    t = clamp(t, 0, 1);

                    let v = min + t * (max - min);

                    const stepAttr = rangeEl.step;
                    const step = (!stepAttr || stepAttr === "any") ? 0 : parseFloat(stepAttr);
                    if (step > 0) {
                        v = Math.round((v - min) / step) * step + min;
                        const digits = Math.max(0, (step.toString().split(".")[1] || "").length);
                        v = parseFloat(v.toFixed(digits));
                    }
                    return v;
                };

                const setFromPointer = (e) => {
                    rangeEl.value = String(getValueFromClientX(e.clientX));
                    rangeEl.dispatchEvent(new Event("input", { bubbles: true }));
                };

                rangeEl.addEventListener("pointerdown", (e) => {
                    if (e.pointerType === "mouse" && e.button !== 0) return;
                    document.documentElement.classList.add("vfw-dragging");
                    rangeEl.setPointerCapture(e.pointerId);
                    setFromPointer(e);
                    e.preventDefault();
                });

                rangeEl.addEventListener("pointermove", (e) => {
                    if (!rangeEl.hasPointerCapture(e.pointerId)) return;
                    setFromPointer(e);
                    e.preventDefault();
                });

                const end = (e) => {
                    if (rangeEl.hasPointerCapture(e.pointerId)) {
                        rangeEl.releasePointerCapture(e.pointerId);
                    }
                    document.documentElement.classList.remove("vfw-dragging");
                };

                rangeEl.addEventListener("pointerup", end);
                rangeEl.addEventListener("pointercancel", end);
            }

            [sA, sH, sK].forEach(el => {
                attachDragAnywhere(el);
                el.addEventListener("input", render);
            });

            resetBtn.addEventListener("click", () => {
                sA.value = "1";
                sH.value = "0";
                sK.value = "0";
                render();
            });

            const ro = new ResizeObserver(() => {
                setCanvasDPI();
                render();
            });
            ro.observe(canvas);

            setCanvasDPI();
            render();
        }
    })();
</script>
