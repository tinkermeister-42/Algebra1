<div class="vertex-form-widget" data-xmin="-10" data-xmax="10" data-ymin="-10"
  data-ymax="10" style="max-width:760px;margin:0rem auto"></div>

<style>
  .vertex-form-widget {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .vfw-card {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 14px;
    background: #fff;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
  }

  .vfw-title {
    font-weight: 800;
    font-size: 2.05rem;
    margin-bottom: 4px;
  }

  .vfw-sub {
    color: #6b7280;
    font-size: 0.95rem;
    margin-bottom: 10px;
  }

  .vfw-layout {
    display: grid;
    gap: 12px;
  }

  .vfw-fig {
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    width: 100%;
    max-width: none;
    margin: 0;
  }

  .vfw-canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    touch-action: none;
  }


  .vfw-controls {
    border: 1px solid #eef2f7;
    border-radius: 12px;
    padding: 10px;
    background: #fafafa;
  }

  .vfw-controlsTop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .vfw-btn {
    border: 1px solid #e5e7eb;
    background: #fff;
    border-radius: 10px;
    padding: 6px 10px;
    font-weight: 750;
    cursor: pointer;
  }

  .vfw-btn:active {
    transform: translateY(1px);
  }

  .vfw-sliders {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .vfw-sliders {
      grid-template-columns: 1fr;
    }
  }

  @media (max-height: 650px) {
    .vfw-card {
      padding: 10px;
    }

    .vfw-title {
      font-size: 1.6rem;
    }

    .vfw-sub {
      margin-bottom: 6px;
    }
  }

  .vfw-row {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 8px 10px 6px;
    background: #fff;
  }

  .vfw-rowHead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }

  .vfw-lbl {
    font-weight: 800;
    letter-spacing: 0.2px;
  }

  .vfw-val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: #374151;
    min-width: 64px;
    text-align: right;
  }

  .vfw-controls input[type="range"] {
    width: 100%;
    accent-color: #2c3e50;
    touch-action: none;
  }

  .vfw-readout {
    border: 1px solid #eef2f7;
    border-radius: 12px;
    padding: 10px 12px;
    background: #fafafa;
  }

  .vfw-readout ul {
    margin: 6px 0 0 18px;
    color: #374151;
  }

  .vfw-hint {
    margin-top: 8px;
    color: #6b7280;
    font-size: 0.95rem;
  }

  html.vfw-dragging,
  html.vfw-dragging * {
    -webkit-user-select: none !important;
    user-select: none !important;
    cursor: grabbing !important;
  }

  .vfw-fig {
    position: relative;
  }

  .vfw-formula {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.88);
    color: #111827;
    font-weight: 650;
    font-size: 1.4rem;
    line-height: 1.2;
    pointer-events: none;
  }
</style>

<script>
  (function () {
    function initAll() {
      document.querySelectorAll(".vertex-form-widget").forEach(createWidget);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initAll, { once: true });
    } else {
      initAll();
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function fmt(n) {
      const v = Math.round(n * 100) / 100;
      return String(v.toFixed(2)).replace(/\.?0+$/, "");
    }

    function createWidget(container) {
      if (container.__vfwInit) return;
      container.__vfwInit = true;

      const xmin0 = +(container.dataset.xmin ?? -10);
      const xmax0 = +(container.dataset.xmax ?? 10);
      const ymin = +(container.dataset.ymin ?? -10);
      const ymax = +(container.dataset.ymax ?? 10);

      container.innerHTML = "";

      const card = document.createElement("div");
      card.className = "vfw-card";
      card.innerHTML = `
        <div class="vfw-title">Quadratic in vertex form</div>
        <div class="vfw-sub">Move the sliders to see how <b>a</b>, <b>h</b>, and <b>k</b> affect the graph.</div>

        <div class="vfw-fig">
          <canvas class="vfw-canvas" role="img"
            aria-label="Graph of a quadratic in vertex form on a fixed window from -10 to 10."></canvas>
          <div class="vfw-formula"></div>
        </div>          

          <div class="vfw-controls">
            <div class="vfw-controlsTop">
              <button class="vfw-btn b-reset" type="button">Reset</button>
            </div>

            <div class="vfw-sliders">
              <div class="vfw-row">
                <div class="vfw-rowHead">
                  <div class="vfw-lbl">a</div>
                  <div class="vfw-val v-a">1</div>
                </div>
                <input class="s-a" type="range" min="-2" max="2" step="0.01" value="1" aria-label="a slider">
              </div>

              <div class="vfw-row">
                <div class="vfw-rowHead">
                  <div class="vfw-lbl">h</div>
                  <div class="vfw-val v-h">0</div>
                </div>
                <input class="s-h" type="range" min="-10" max="10" step="0.01" value="0" aria-label="h slider">
              </div>

              <div class="vfw-row">
                <div class="vfw-rowHead">
                  <div class="vfw-lbl">k</div>
                  <div class="vfw-val v-k">0</div>
                </div>
                <input class="s-k" type="range" min="-10" max="10" step="0.01" value="0" aria-label="k slider">
              </div>
            </div>
          </div>

          <div class="vfw-readout" aria-live="polite">
            <div style="font-weight:800;">Key facts</div>
            <ul>
              <li>Vertex: <span class="vx">(0, 0)</span></li>
              <li>Axis of symmetry: <span class="ax">x = 0</span></li>
              <li>Opens: <span class="op">up</span></li>
              <li>Shape: <span class="sh">normal</span></li>
            </ul>
            <div class="vfw-hint">
              If the parabola leaves the window, bring <b>a</b> closer to 0 or move the vertex back.
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);

      const fig = card.querySelector(".vfw-fig");
      const canvas = card.querySelector(".vfw-canvas");
      const ctx = canvas.getContext("2d");
      const formulaEl = card.querySelector(".vfw-formula");

      const sA = card.querySelector(".s-a");
      const sH = card.querySelector(".s-h");
      const sK = card.querySelector(".s-k");

      const vA = card.querySelector(".v-a");
      const vH = card.querySelector(".v-h");
      const vK = card.querySelector(".v-k");

      const vxEl = card.querySelector(".vx");
      const axEl = card.querySelector(".ax");
      const opEl = card.querySelector(".op");
      const shEl = card.querySelector(".sh");

      const resetBtn = card.querySelector(".b-reset");

      // Canvas size in CSS pixels
      let W = 520;
      let H = 320;

      // Dynamic x-window (expands to match aspect ratio)
      let xmin = xmin0;
      let xmax = xmax0;

      function f(x, a, h, k) {
        const t = x - h;
        return a * t * t + k;
      }

      function updateWorldWindow() {
        const yRange = ymax - ymin;
        const aspect = W / H;

        const xRange = yRange * aspect;
        const xMid = (xmin0 + xmax0) / 2;

        xmin = xMid - xRange / 2;
        xmax = xMid + xRange / 2;
      }

      function setCanvasDPI() {
        const dpr = window.devicePixelRatio || 1;

        // CSS decides the actual size
        const cssW = Math.max(1, Math.floor(canvas.clientWidth));
        const cssH = Math.max(1, Math.floor(canvas.clientHeight));

        // Backing store matches CSS size times DPR
        canvas.width = Math.max(1, Math.floor(cssW * dpr));
        canvas.height = Math.max(1, Math.floor(cssH * dpr));

        // Draw in CSS pixel coordinates
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Save for drawing code
        W = cssW;
        H = cssH;

        updateWorldWindow();
      }

      function worldToCanvas(x, y) {
        const px = (x - xmin) / (xmax - xmin) * W;
        const py = H - (y - ymin) / (ymax - ymin) * H;
        return [px, py];
      }

      function drawGridAxes() {
        ctx.clearRect(0, 0, W, H);

        // Choose a step so grid is not a barcode
        function chooseStep(pxPerUnit) {
          if (pxPerUnit < 10) return 5;
          if (pxPerUnit < 18) return 2;
          return 1;
        }

        const xPxPerUnit = W / (xmax - xmin);
        const yPxPerUnit = H / (ymax - ymin);

        const xStep = chooseStep(xPxPerUnit);
        const yStep = chooseStep(yPxPerUnit);

        // grid
        ctx.save();
        ctx.globalAlpha = 0.10;
        ctx.lineWidth = 1;

        // vertical grid lines
        for (let x = Math.ceil(xmin / xStep) * xStep; x <= xmax + 1e-9; x += xStep) {
          const [px] = worldToCanvas(x, 0);
          ctx.beginPath();
          ctx.moveTo(px, 0);
          ctx.lineTo(px, H);
          ctx.stroke();
        }

        // horizontal grid lines
        for (let y = Math.ceil(ymin / yStep) * yStep; y <= ymax + 1e-9; y += yStep) {
          const [, py] = worldToCanvas(0, y);
          ctx.beginPath();
          ctx.moveTo(0, py);
          ctx.lineTo(W, py);
          ctx.stroke();
        }

        ctx.restore();

        // axes
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = 2;

        const [x0] = worldToCanvas(0, 0);
        const [, y0] = worldToCanvas(0, 0);

        ctx.beginPath();
        ctx.moveTo(0, y0);
        ctx.lineTo(W, y0);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x0, 0);
        ctx.lineTo(x0, H);
        ctx.stroke();
        ctx.restore();

        // labels
        ctx.save();
        ctx.globalAlpha = 0.65;
        ctx.fillStyle = "#111827";
        ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, Arial";

        // label every grid line, but skip zero
        for (let x = Math.ceil(xmin / xStep) * xStep; x <= xmax + 1e-9; x += xStep) {
          if (Math.abs(x) < 1e-9) continue;
          const [px, py] = worldToCanvas(x, 0);
          ctx.fillText(String(Math.round(x)), px + 3, py + 3);
        }

        for (let y = Math.ceil(ymin / yStep) * yStep; y <= ymax + 1e-9; y += yStep) {
          if (Math.abs(y) < 1e-9) continue;
          const [px, py] = worldToCanvas(0, y);
          ctx.fillText(String(Math.round(y)), px + 6, py - 3);
        }

        ctx.restore();
      }

      function drawParabola(a, h, k) {
        ctx.save();
        ctx.globalAlpha = 0.95;
        ctx.lineWidth = 3;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";

        const steps = 900;
        const cushion = 0.25;

        let penDown = false;
        ctx.beginPath();

        for (let i = 0; i <= steps; i++) {
          const x = xmin + (xmax - xmin) * (i / steps);
          const y = f(x, a, h, k);

          const inWindow = (y >= ymin - cushion && y <= ymax + cushion);
          if (!inWindow) { penDown = false; continue; }

          const [px, py] = worldToCanvas(x, y);
          if (!penDown) { ctx.moveTo(px, py); penDown = true; }
          else ctx.lineTo(px, py);
        }

        ctx.stroke();
        ctx.restore();
      }

      function drawVertexAxis(h, k) {
        const [px, py] = worldToCanvas(h, k);

        ctx.save();
        ctx.globalAlpha = 0.25;
        ctx.setLineDash([8, 8]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px, 0);
        ctx.lineTo(px, H);
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.95;
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function prettyFormulaText(a, h, k) {
        const minus = "−";
        const aTxt = fmt(a);

        const inner =
          (Math.abs(h) < 1e-12) ? "x" :
            (h >= 0) ? `x ${minus} ${fmt(h)}` :
              `x ${minus} (${fmt(h)})`;

        let kPart = "";
        if (Math.abs(k) > 1e-12) {
          kPart = (k > 0) ? ` + ${fmt(k)}` : ` ${minus} ${fmt(Math.abs(k))}`;
        }

        return `f(x) = ${aTxt}(${inner})²${kPart}`;
      }
      function latexFormula(a, h, k) {
        const aTxt = fmt(a);

        const hAbs = Math.abs(h);
        const hPart =
          (hAbs < 1e-12) ? "x" :
            (h > 0) ? `x-${fmt(hAbs)}` :
              `x+${fmt(hAbs)}`;

        const kAbs = Math.abs(k);
        const kPart =
          (kAbs < 1e-12) ? "" :
            (k > 0) ? `+${fmt(kAbs)}` :
              `-${fmt(kAbs)}`;

        return `\\(f(x)=${aTxt}\\left(${hPart}\\right)^{2}${kPart}\\)`;
      }

      function typesetMath(el) {
        const MJ = window.MathJax;
        if (!MJ) return;
        if (MJ.typesetPromise) MJ.typesetPromise([el]);
        else if (MJ.typeset) MJ.typeset([el]);
      }

      function drawPlotTitle(a, h, k) {
        const text = prettyFormulaText(a, h, k);

        ctx.save();
        ctx.font = "600 20px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.textBaseline = "top";

        const pad = 8;
        const x = 10;
        const y = 10;

        const tw = ctx.measureText(text).width;
        const boxW = tw + pad * 2;
        const boxH = 20 + pad;

        ctx.globalAlpha = 0.85;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x, y, boxW, boxH);

        ctx.globalAlpha = 1;
        ctx.fillStyle = "#111827";
        ctx.fillText(text, x + pad, y + 5);

        ctx.restore();
      }

      function updateReadout(a, h, k) {
        vA.textContent = fmt(a);
        vH.textContent = fmt(h);
        vK.textContent = fmt(k);

        vxEl.textContent = `(${fmt(h)}, ${fmt(k)})`;
        axEl.textContent = `x = ${fmt(h)}`;

        opEl.textContent = (a > 0) ? "up" : (a < 0) ? "down" : "flat (a = 0)";

        const absA = Math.abs(a);
        shEl.textContent =
          (absA === 0) ? "not a parabola" :
            (Math.abs(absA - 1) < 1e-12) ? "normal" :
              (absA > 1) ? "narrower" : "wider";
      }

      function read() {
        return { a: +sA.value, h: +sH.value, k: +sK.value };
      }

      function render() {
        const { a, h, k } = read();
        updateReadout(a, h, k);
        formulaEl.innerHTML = latexFormula(a, h, k);
        typesetMath(formulaEl);

        drawGridAxes();

        if (Math.abs(a) > 1e-12) {
          drawParabola(a, h, k);
        } else {
          ctx.save();
          ctx.globalAlpha = 0.95;
          ctx.lineWidth = 3;
          const [p1x, p1y] = worldToCanvas(xmin, k);
          const [p2x, p2y] = worldToCanvas(xmax, k);
          ctx.beginPath();
          ctx.moveTo(p1x, p1y);
          ctx.lineTo(p2x, p2y);
          ctx.stroke();
          ctx.restore();
        }

        drawVertexAxis(h, k);
      }

      function attachDragAnywhere(rangeEl) {
        rangeEl.style.touchAction = "none";

        function getValueFromClientX(clientX) {
          const r = rangeEl.getBoundingClientRect();
          const min = parseFloat(rangeEl.min);
          const max = parseFloat(rangeEl.max);

          let t = (clientX - r.left) / r.width;
          t = clamp(t, 0, 1);

          let v = min + t * (max - min);

          const stepAttr = rangeEl.step;
          const step = (!stepAttr || stepAttr === "any") ? 0 : parseFloat(stepAttr);
          if (step > 0) {
            v = Math.round((v - min) / step) * step + min;
            const digits = Math.max(0, (step.toString().split(".")[1] || "").length);
            v = parseFloat(v.toFixed(digits));
          }
          return v;
        }

        function setFromPointer(e) {
          rangeEl.value = String(getValueFromClientX(e.clientX));
          rangeEl.dispatchEvent(new Event("input", { bubbles: true }));
        }

        rangeEl.addEventListener("pointerdown", (e) => {
          if (e.pointerType === "mouse" && e.button !== 0) return;
          document.documentElement.classList.add("vfw-dragging");
          rangeEl.setPointerCapture(e.pointerId);
          setFromPointer(e);
          e.preventDefault();
        });

        rangeEl.addEventListener("pointermove", (e) => {
          if (!rangeEl.hasPointerCapture(e.pointerId)) return;
          setFromPointer(e);
          e.preventDefault();
        });

        function end(e) {
          if (rangeEl.hasPointerCapture(e.pointerId)) rangeEl.releasePointerCapture(e.pointerId);
          document.documentElement.classList.remove("vfw-dragging");
        }

        rangeEl.addEventListener("pointerup", end);
        rangeEl.addEventListener("pointercancel", end);
      }

      [sA, sH, sK].forEach((el) => {
        attachDragAnywhere(el);
        el.addEventListener("input", render);
      });

      resetBtn.addEventListener("click", () => {
        sA.value = "1";
        sH.value = "0";
        sK.value = "0";
        render();
      });

      const ro = new ResizeObserver(() => {
        setCanvasDPI();
        render();
      });
      ro.observe(fig);

      let rzTimer = 0;
      window.addEventListener("resize", () => {
        clearTimeout(rzTimer);
        rzTimer = setTimeout(() => { setCanvasDPI(); render(); }, 80);
      }, { passive: true });

      setCanvasDPI();
      render();
    }
  })();
</script>
