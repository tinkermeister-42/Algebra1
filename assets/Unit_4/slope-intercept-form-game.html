<!-- Line Match Game – v5.35 (full game + controls restored; animations; time-bonus bands; extra-life toast) -->
<div class="lm9-root" data-max-moves="6" data-lives="3"></div>

<style>
  :root {
    --plot-pad: 12px;
    --bg-card: #f9fafb;
    --bd-card: #e2e8f0;
    --ink: #0f172a;
    --accent: #2563eb;
    --accent-strong: #1d4ed8;
    --grid: #e2e8f0;
    --axis: #111827;
    --target: #10b981;
    --player: #2563eb;
    --warn: #f59e0b;
    --danger: #ef4444;
  }

  .lm9-root {
    max-width: 600px;
    margin: 16px auto;
    padding: 14px;
    font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial;
    color: var(--ink);
  }

  .lm9-grid {
    display: grid;
    grid-template-columns: 1fr;
    grid-auto-rows: auto;
    gap: 10px
  }

  /* SCOREBOARD */
  .scoreboard {
    background: #fff;
    border: 1px solid var(--bd-card);
    border-radius: 10px;
    padding: 6px 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    align-items: stretch
  }

  .tile {
    background: #fff;
    border: 1px solid var(--bd-card);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: border-color .2s, color .2s
  }

  .tile .lbl {
    font-size: 11px;
    letter-spacing: .06em;
    color: #475569;
    font-weight: 800;
    text-transform: uppercase
  }

  .tile .val {
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 18px;
    font-weight: 900;
    margin-top: 2px
  }

  .tile.time.warn,
  .tile.moves.warn {
    border-color: var(--warn);
    animation: pulseRing 1.3s ease-out infinite
  }

  .tile.time.danger,
  .tile.moves.danger {
    border-color: var(--danger);
    animation: pulseRing 0.85s ease-out infinite
  }

  .tile.life {
    position: relative
  }

  .life-toast {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #10b981;
    color: #fff;
    border-radius: 9999px;
    padding: 2px 6px;
    font: 800 11px system-ui, Segoe UI, Roboto, Helvetica, Arial;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity .18s ease, transform .18s ease;
    box-shadow: 0 2px 6px rgba(16, 185, 129, .35)
  }

  .life-toast.show {
    opacity: 1;
    transform: translateY(0)
  }

  /* GRAPH */
  .plot-wrap {
    position: relative;
    padding: 10px;
    overflow: hidden;
    border-radius: 12px;
    background: #fff;
    border: 1px solid #e5e7eb
  }

  .plot {
    width: 100%;
    aspect-ratio: 1/1;
    height: auto;
    display: block;
    background: #ffffff;
    border-radius: 10px;
    border: 0
  }

  .eq-badge {
    position: absolute;
    z-index: 2;
    top: var(--plot-pad);
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    color: #111827;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 6px 10px;
    font: 700 13px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .05);
    display: none;
    animation: popIn .18s ease-out;
    will-change: transform, opacity
  }

  .start-overlay {
    position: absolute;
    inset: 10px;
    background: rgba(255, 255, 255, 0.96);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    border-radius: 10px;
    border: 1px dashed #e5e7eb
  }

  .start-overlay .msg {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center
  }

  .start-overlay .hint {
    font-size: 12px;
    color: #475569
  }

  .confetti {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden
  }

  .confetti .p {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 1px;
    opacity: 0;
    will-change: transform, opacity
  }

  /* CONTROLS */
  .controls {
    background: #fff;
    border: 1px solid var(--bd-card);
    border-radius: 10px;
    padding: 8px 10px;
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px 10px;
    align-items: end
  }

  .field {
    display: flex;
    align-items: center;
    gap: 6px
  }

  .field label {
    font-weight: 800;
    min-width: 22px;
    font-size: 12px;
    color: #334155
  }

  .input {
    height: 32px;
    width: 100%;
    padding: 0 10px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13px;
    background: #fff;
    color: #0f172a
  }

  .actions {
    display: flex;
    justify-content: flex-end
  }

  .btn {
    border: 1px solid var(--accent-strong);
    background: var(--accent);
    border-radius: 8px;
    padding: 7px 12px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    font-size: 12px
  }

  .btn:hover {
    background: var(--accent-strong);
    border-color: var(--accent-strong)
  }

  .btn:active {
    transform: translateY(1px)
  }

  /* MODAL */
  .lm-modal-bg {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: radial-gradient(1000px 600px at 50% -20%, rgba(99, 102, 241, .35), rgba(15, 23, 42, .70));
    z-index: 2147483000
  }

  .lm-modal {
    width: min(420px, 92vw);
    border-radius: 16px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
    color: #0f172a;
    border: 1px solid #e5e7eb
  }

  .lm-modal-header {
    padding: 12px;
    background: #fff;
    color: #0f172a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e5e7eb
  }

  .lm-modal-header h4 {
    margin: 0;
    font-size: 19px
  }

  .lm-modal-body {
    padding: 12px
  }

  .lm-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 6px 0
  }

  .lm-row .lm-label {
    color: #334155;
    font-weight: 700
  }

  .lm-modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 10px 12px;
    background: #fff;
    border-top: 1px solid #e5e7eb
  }

  .celebrate {
    font-size: 22px
  }

  /* Animations */
  @keyframes pulseRing {
    0% {
      box-shadow: 0 0 0 0 rgba(37, 99, 235, .35)
    }

    100% {
      box-shadow: 0 0 0 14px rgba(37, 99, 235, 0)
    }
  }

  @keyframes bump {
    0% {
      transform: scale(1)
    }

    35% {
      transform: scale(1.08)
    }

    100% {
      transform: scale(1)
    }
  }

  .val.bump {
    animation: bump .26s ease-out
  }

  @keyframes popIn {
    0% {
      transform: translateY(-6px) scale(.96);
      opacity: 0
    }

    100% {
      transform: translateY(0) scale(1);
      opacity: 1
    }
  }

  .start-overlay .btn {
    position: relative;
    overflow: hidden
  }

  .start-overlay .btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 0%, rgba(255, 255, 255, .35) 20%, transparent 40%);
    background-size: 200% 100%;
    animation: shine 2.4s linear infinite
  }

  @keyframes shine {
    0% {
      background-position: -200% 0
    }

    100% {
      background-position: 200% 0
    }
  }

  @media (prefers-reduced-motion: reduce) {

    .tile.time.warn,
    .tile.time.danger,
    .tile.moves.warn,
    .tile.moves.danger,
    .val.bump,
    .eq-badge,
    .start-overlay .btn::after {
      animation: none
    }
  }
</style>

<script>
  (function () {
    function initAll() { document.querySelectorAll('.lm9-root').forEach(initWidget); }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initAll, { once: true }); } else { initAll(); }

    function initWidget(root) {
      if (root.__init) return; root.__init = true;
      const maxMoves = parseInt(root.dataset.maxMoves || '6', 10);
      const maxLives = parseInt(root.dataset.lives || '3', 10);

      const state = {
        xmin: -10, xmax: 10, ymin: -10, ymax: 10,
        m: 0, mFrac: { n: 0, d: 1 }, b: 0, mSet: false, bSet: false,
        animM: null, animB: null, pulse: null,
        tdy: 1, tdx: 1, tb: 0, moves: 0, score: 0, lives: maxLives,
        turnLimitSec: 60, timer: null, deadline: 0, lastShownSec: null
      };

      // Build UI (stacked: Score → Graph → Controls)
      const grid = el('div', 'lm9-grid');

      // SCORE
      const board = el('div', 'scoreboard');
      const tMoves = tile('Moves'); tMoves.wrap.classList.add('moves');
      const tTime = tile('Time'); tTime.wrap.classList.add('time'); tTime.val.textContent = state.turnLimitSec + 's';
      const tLives = tile('Lives'); tLives.wrap.classList.add('life');
      const tScore = tile('Score');
      board.append(tMoves.wrap, tTime.wrap, tLives.wrap, tScore.wrap);

      // GRAPH
      const wrap = el('div', 'plot-wrap');
      const canvas = el('canvas', 'plot');
      const eqBadge = el('div', 'eq-badge');
      const overlay = el('div', 'start-overlay'); const ovMsg = el('div', 'msg'); const ovHint = el('div', 'hint'); ovHint.textContent = "Press Start when you're ready."; const ovBtn = button('Start', 'btn'); ovMsg.append(ovBtn, ovHint); overlay.append(ovMsg);
      const confetti = el('div', 'confetti');
      wrap.append(canvas, eqBadge, overlay, confetti);

      // CONTROLS
      const controls = el('div', 'controls');
      const slopeField = field('m', input('text', 'e.g., -3/2', 'slope'));
      const bField = field('b', input('number', 'integer', 'b'));
      const actions = el('div', 'actions');
      const apply = button('Apply', 'btn');
      actions.append(apply);
      controls.append(slopeField.wrap, bField.wrap, actions);

      // Mount order
      grid.append(board, wrap, controls);
      root.append(grid);

      // Modal (no Close)
      const modalBg = el('div', 'lm-modal-bg'); const modal = el('div', 'lm-modal');
      const mh = el('div', 'lm-modal-header'); const mhTitle = el('h4'); mhTitle.textContent = 'Round result'; const mhCele = el('div', 'celebrate'); mh.append(mhTitle, mhCele);
      const mb = el('div', 'lm-modal-body'); const rEq = row('Equation:'), rBonus = row('Time bonus:'), rPts = row('Points earned:'), rMoves = row('Moves used:'), rLives = row('Lives left:'); mb.append(rEq.wrap, rBonus.wrap, rPts.wrap, rMoves.wrap, rLives.wrap);
      const ma = el('div', 'lm-modal-actions'); const mNext = button('Next line', 'btn'), mReset = button('New game', 'btn'); ma.append(mNext, mReset);
      modal.append(mh, mb, ma); modalBg.append(modal); document.body.append(modalBg); modalBg.style.display = 'none';

      // Drawing
      let raf = null; const M = { left: 34, right: 34, top: 56, bottom: 36 }; let lastW = 0;
      function worldToPix(x, y, W, H) { const innerW = W - M.left - M.right, innerH = H - M.top - M.bottom; const sx = innerW / (state.xmax - state.xmin), sy = innerH / (state.ymax - state.ymin); const px = M.left + (x - state.xmin) * sx; const py = M.top + innerH - (y - state.ymin) * sy; return [px, py]; }
      function sizeForDPR(c, w, h) { const base = window.devicePixelRatio || 1; const dpr = Math.min(4, base * 3); c.width = Math.max(1, Math.floor(w * dpr)); c.height = Math.max(1, Math.floor(h * dpr)); const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.imageSmoothingEnabled = false; return ctx; }

      function draw() {
        const W = Math.max(1, Math.round(wrap.clientWidth || root.clientWidth || 300)); if (W < 10) { schedule(); return; }
        const H = W; const ctx = sizeForDPR(canvas, W, H); lastW = W; ctx.clearRect(0, 0, W, H);
        const gridCol = getCSS('--grid'), axisCol = getCSS('--axis');
        // grid
        ctx.lineWidth = 1; ctx.strokeStyle = gridCol;
        for (let x = Math.ceil(state.xmin); x <= Math.floor(state.xmax); x++) {
          const [px0, py0] = worldToPix(x, state.ymin, W, H); const [px1, py1] = worldToPix(x, state.ymax, W, H); const X = Math.round(px0) + 0.5; ctx.beginPath(); ctx.moveTo(X, py0); ctx.lineTo(X, py1); ctx.stroke();
        }
        for (let y = Math.ceil(state.ymin); y <= Math.floor(state.ymax); y++) {
          const [px0, py0] = worldToPix(state.xmin, y, W, H); const [px1, py1] = worldToPix(state.xmax, y, W, H); const Y = Math.round(py0) + 0.5; ctx.beginPath(); ctx.moveTo(px0, Y); ctx.lineTo(px1, Y); ctx.stroke();
        }
        // axes
        ctx.strokeStyle = axisCol; ctx.lineWidth = 1.8; const [xL, y0] = worldToPix(state.xmin, 0, W, H); const [xR] = worldToPix(state.xmax, 0, W, H); const yAxisPx = Math.round(y0) + 0.5; ctx.beginPath(); ctx.moveTo(xL, yAxisPx); ctx.lineTo(xR, yAxisPx); ctx.stroke(); const [x0, yB] = worldToPix(0, state.ymin, W, H); const [, yT] = worldToPix(0, state.ymax, W, H); const xAxisPx = Math.round(x0) + 0.5; ctx.beginPath(); ctx.moveTo(xAxisPx, yB); ctx.lineTo(xAxisPx, yT); ctx.stroke();
        // ticks
        ctx.fillStyle = '#0f172a'; ctx.font = '12px system-ui'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.25;
        for (let x = Math.ceil(state.xmin); x <= Math.floor(state.xmax); x++) {
          const [px] = worldToPix(x, 0, W, H); const X = Math.round(px) + 0.5; ctx.beginPath(); ctx.moveTo(X, yAxisPx - 5); ctx.lineTo(X, yAxisPx + 5); ctx.stroke(); if (x !== 0) ctx.fillText(String(x), X - 4, yAxisPx + 16);
        }
        for (let y = Math.ceil(state.ymin); y <= Math.floor(state.ymax); y++) {
          const [, py] = worldToPix(0, y, W, H); const Y = Math.round(py) + 0.5; ctx.beginPath(); ctx.moveTo(xAxisPx - 5, Y); ctx.lineTo(xAxisPx + 5, Y); ctx.stroke(); if (y !== 0) ctx.fillText(String(y), xAxisPx + 8, Y + 4);
        }
        // lines
        function lineWithHalo(m, b, color, width, glow = false) {
          const pts = []; const xMin = state.xmin, xMax = state.xmax, yMin = state.ymin, yMax = state.ymax; const yL = m * xMin + b, yR = m * xMax + b; add(xMin, yL); add(xMax, yR); if (Math.abs(m) > 1e-12) { add((yMin - b) / m, yMin); add((yMax - b) / m, yMax); } function add(x, y) { if (x >= xMin - 1e-9 && x <= xMax + 1e-9 && y >= yMin - 1e-9 && y <= yMax + 1e-9) pts.push([x, y]); } if (pts.length < 2) return; const [x1, y1] = worldToPix(pts[0][0], pts[0][1], W, H); const [x2, y2] = worldToPix(pts[1][0], pts[1][1], W, H); ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          // white edge for separation from grid
          ctx.lineWidth = width + 2; ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
          // main stroke
          ctx.lineWidth = width; ctx.strokeStyle = color; if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 6; }
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.shadowBlur = 0; ctx.restore();
        }
        // target + player
        lineWithHalo(slopeFromFrac(state.tdy, state.tdx), state.tb, getCSS('--target'), 2.25);
        if (state.mSet && state.bSet) { const pulsing = state.pulse && (performance.now() - state.pulse.start < state.pulse.dur); if (pulsing) lineWithHalo(currentM(), currentB(), 'rgba(16,185,129,0.55)', 7); lineWithHalo(currentM(), currentB(), getCSS('--player'), 3.25, true); }
        // badge
        if (state.mSet && state.bSet) { eqBadge.textContent = formatEquation(state.mFrac, state.b); eqBadge.style.display = 'block'; } else { eqBadge.style.display = 'none'; }
        if ((state.animM && !animDone(state.animM)) || (state.animB && !animDone(state.animB)) || (state.pulse && performance.now() - state.pulse.start < state.pulse.dur)) schedule();
      }
      function schedule() { if (raf) return; raf = requestAnimationFrame(() => { raf = null; draw(); }); }
      function startAnimM(from, to, dur = 300) { state.animM = { from, to, start: performance.now(), dur }; schedule(); }
      function startAnimB(from, to, dur = 300) { state.animB = { from, to, start: performance.now(), dur }; schedule(); }
      function ease(t) { return t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }
      function animValue(a) { const t = Math.min(1, (performance.now() - a.start) / a.dur); const e = ease(t); return a.from + (a.to - a.from) * e; }
      function animDone(a) { return (performance.now() - a.start) >= a.dur; }
      function currentM() { return state.animM ? animValue(state.animM) : state.m; }
      function currentB() { return state.animB ? animValue(state.animB) : state.b; }

      // Math helpers
      function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = b; b = a % b; a = t; } return a || 1; }
      function simplify(n, d) { if (d === 0) return { n: 1, d: 0 }; if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; }
      function fracStr(n, d) { const s = simplify(n, d); return s.d === 1 ? String(s.n) : `(${s.n}/${s.d})`; }
      function slopeFromFrac(n, d) { return d === 0 ? Infinity : n / d; }
      function decimalToFrac(x, maxDen = 100) { const s = Math.sign(x); const ax = Math.abs(x); const num = Math.round(ax * maxDen); const g = gcd(num, maxDen); const r = simplify(s * num / g, maxDen / g); return r; }
      function parseSlope(str) { const raw = (str || '').trim(); if (!raw) return null; if (raw.includes('/')) { const parts = raw.split('/'); if (parts.length !== 2) return null; const a = parseInt(parts[0], 10), b = parseInt(parts[1], 10); if (!Number.isFinite(a) || !Number.isFinite(b) || b === 0) return null; const s = simplify(a, b); return { m: slopeFromFrac(s.n, s.d), frac: s }; } const m = Number(raw); if (Number.isFinite(m)) { return { m, frac: decimalToFrac(m, 100) }; } return null; }
      function fmtB(b) { return `${b >= 0 ? '+' : '−'} ${Math.abs(b)}`; }
      function formatEquation(frac, b) { const s = simplify(frac.n, frac.d); let mStr = ''; if (s.n === 1 && s.d === 1) { mStr = 'x'; } else if (s.n === -1 && s.d === 1) { mStr = '− x'; } else { const core = s.d === 1 ? String(s.n) : `(${s.n}/${s.d})`; mStr = `${core}x`; } let bStr = ''; if (b > 0) bStr = ` + ${Math.abs(b)}`; else if (b < 0) bStr = ` − ${Math.abs(b)}`; return `y = ${mStr}${bStr}`; }

      // Time bonus bands: 0–19s → ×1, 20–39s → ×2, 40–60s → ×3
      function timeMult(sec) { if (sec >= 40) return 3; if (sec >= 20) return 2; return 1; }

      // Indicators
      function updateIndicators() { const left = Math.max(0, Math.ceil((state.deadline - performance.now()) / 1000)); tTime.wrap.classList.toggle('warn', left <= 10 && left > 5); tTime.wrap.classList.toggle('danger', left <= 5); const movesLeft = maxMoves - state.moves; tMoves.wrap.classList.toggle('warn', movesLeft <= 2 && movesLeft > 1); tMoves.wrap.classList.toggle('danger', movesLeft <= 1); }

      // Timer
      function startTimer() { stopTimer(); state.deadline = performance.now() + state.turnLimitSec * 1000; state.lastShownSec = null; tTime.wrap.classList.remove('warn', 'danger'); tTime.val.textContent = state.turnLimitSec + 's'; state.timer = setInterval(() => { const left = Math.max(0, Math.ceil((state.deadline - performance.now()) / 1000)); if (left !== state.lastShownSec) { state.lastShownSec = left; tTime.val.textContent = left + 's'; updateIndicators(); } if (left <= 0) { stopTimer(); handleTimeout(); } }, 200); }
      function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }
      function handleTimeout() { if (state.lives <= 0) return; if (state.lives > 0) state.lives -= 1; if (state.lives < 0) state.lives = 0; updateBoard(); if (state.lives <= 0) { setControlsEnabled(false); } showModal(false, 0, 'time'); }

      // Target + game logic
      function randint(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
      function prepareTarget() { const xmin = state.xmin, xmax = state.xmax, ymin = state.ymin, ymax = state.ymax; function fits(m, b) { const yL = m * xmin + b, yR = m * xmax + b; const xB = Math.abs(m) < 1e-12 ? Infinity : (ymin - b) / m; const xT = Math.abs(m) < 1e-12 ? Infinity : (ymax - b) / m; const cond1 = (yL >= ymin && yL <= ymax) || (yR >= ymin && yR <= ymax); const cond2 = (xB >= xmin && xB <= xmax) || (xT >= xmin && xT <= xmax); return cond1 || cond2; } let tries = 0; do { state.tb = randint(-8, 8); let dx = randint(1, 6), dy = randint(-6, 6); while (dy === 0) dy = randint(-6, 6); const s = simplify(dy, dx); state.tdy = Math.max(-8, Math.min(8, s.n)); state.tdx = Math.max(1, Math.min(8, s.d)); tries++; } while (tries < 50 && !fits(slopeFromFrac(state.tdy, state.tdx), state.tb)); state.moves = 0; state.mSet = false; state.bSet = false; state.pulse = null; state.animM = null; state.animB = null; slopeField.input.value = ''; bField.input.value = ''; setControlsEnabled(false); updateBoard(); schedule(); }
      function newTarget() { if (state.lives <= 0) return; prepareTarget(); showOverlay(); }
      function startRound() { hideOverlay(); setControlsEnabled(true); startTimer(); }
      function showOverlay() { overlay.style.display = 'flex'; }
      function hideOverlay() { overlay.style.display = 'none'; }
