<!-- Line Match Game – v5.6 (restore full game; compact controls; Score → Controls → Graph) |
  Fixes:
  - Restores full grid/logic after v5.5 regression
  - Compact controls (smaller fonts/inputs/buttons)
  - Order: Score top, Controls below, Graph last (wide)
  - Quarto-safe modal classes; responsive canvas uses plot container width
  - Prevents canvas overflow (right padding + overflow hidden)
-->
<div class="lm9-root" data-max-moves="6" data-lives="3"></div>

<style>
  :root{
    --bg-card:#f9fafb; --bd-card:#e5e7eb; --ink:#0f172a;
    --accent:#2563eb; --accent-2:#10b981; --grid:#e2e8f0; --axis:#111827;
    --target:#64748b; --player:#0ea5e9; --pill-bg:#eef2ff; --pill-bd:#c7d2fe;
    --badge-bg:#e0e7ff; --badge-ink:#3730a3;
  }
  .lm9-root{max-width:1100px;margin:16px auto;padding:14px;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;color:var(--ink)}
  .lm9-grid{display:grid;grid-template-columns:1fr;grid-auto-rows:auto;gap:12px}
  .card{background:var(--bg-card);border:1px solid var(--bd-card);border-radius:16px;box-shadow:0 2px 10px rgba(2,6,23,.06)}
  .card h3{margin:0;padding:10px 14px 0;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-body{padding:12px}

  /* Single column to maximize graph width in Quarto */
  @media (min-width:920px){ .lm9-grid{grid-template-columns:1fr;gap:14px} }

  /* Controls — compact */
  .controls{display:grid;gap:8px}
  .field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .field label{font-weight:800;min-width:90px;font-size:13px}
  .input{height:36px;min-width:150px;max-width:240px;width:100%;padding:0 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;background:#fff}
  .btn{border:1px solid var(--accent);background:linear-gradient(180deg,#60a5fa,#3b82f6);border-radius:10px;padding:7px 12px;font-weight:800;color:#fff;cursor:pointer;font-size:14px}
  .btn-ghost{background:#fff;color:var(--accent);border:1px solid #cbd5e1}
  .btn-danger{background:linear-gradient(180deg,#ef4444,#dc2626);border-color:#dc2626}
  .hint{color:#475569;font-size:12px}

  /* Score — compact pills */
  .score-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--pill-bd);border-radius:9999px;background:var(--pill-bg);font-weight:800;font-size:13px}
  .pill .muted{font-weight:800;color:var(--accent)}

  /* Graph sizing & padding */
  .plot-wrap{position:relative;padding:12px 20px 16px 16px;overflow:hidden}
  .plot{width:100%;min-width:300px;display:block;background:#fff;border-radius:14px}
  .eq-badge{position:absolute;left:16px;top:16px;background:var(--badge-bg);color:var(--badge-ink);border-radius:14px;padding:10px 14px;font:900 16px system-ui;box-shadow:0 4px 10px rgba(0,0,0,.08);border:1px solid #c7d2fe}

  /* Quarto-safe modal classes */
  .lm-modal-bg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(1000px 600px at 50% -20%, rgba(99,102,241,.35), rgba(15,23,42,.70));z-index:2147483000}
  .lm-modal{width:min(500px,calc(100% - 32px));border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#ffffff,#f1f5f9);box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .lm-modal-header{padding:12px;background:linear-gradient(90deg,#6366f1 0%, #10b981 100%);color:white;display:flex;align-items:center;justify-content:space-between}
  .lm-modal-header h4{margin:0;font-size:19px}
  .lm-modal-body{padding:12px}
  .lm-row{display:flex;justify-content:space-between;gap:12px;margin:6px 0}
  .lm-row .lm-label{color:#475569}
  .lm-modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;background:#eef2ff}
  .celebrate{font-size:22px}
  @media (max-width:600px){.card-body{padding:10px}.field{flex-direction:column;align-items:flex-start}.btn{width:100%}}
</style>

<script>
(function(){
  function initAll(){ document.querySelectorAll('.lm9-root').forEach(initWidget); }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', initAll, {once:true}); } else { initAll(); }

  function initWidget(root){
    if(root.__init) return; root.__init = true;
    const maxMoves = toInt(root.dataset.maxMoves, 6);
    const maxLives = toInt(root.dataset.lives, 3);
    const state = { xmin:-10,xmax:10,ymin:-10,ymax:10,
      m:0,mFrac:{n:0,d:1}, b:0, mSet:false,bSet:false,
      animM:null,animB:null,pulse:null,
      tdy:1,tdx:1,tb:0, moves:0, score:0, lives:maxLives };

    // Build UI — Score, then Controls, then Graph
    const grid = el('div','lm9-grid');

    const score = card('Score & Lives');
    const newBtn = button('New Game','btn btn-danger');
    score.root.querySelector('h3').append(newBtn);
    const badges = el('div','badges');
    const pillMoves = pill('Moves', `${state.moves}/${maxMoves}`);
    const pillLives = pill('Lives', `${state.lives}`);
    const pillScore = pill('Score', `${state.score}`);
    badges.append(pillMoves,pillLives,pillScore);
    score.body.append(elWrap('div','score-wrap',badges));

    const ctrl = card('Controls');
    const controls = el('div','controls');
    const slopeField = field('Slope m', input('text','e.g., -3/2','slope'));
    const bField = field('Intercept b', input('number','integer','b'));
    const actions = el('div','field');
    const apply = button('Apply','btn');
    actions.append(apply);
    const hint = el('div','hint'); hint.textContent='Press Enter in either box to apply both at once.';
    controls.append(slopeField.wrap,bField.wrap,actions,hint);
    ctrl.body.append(controls);

    const graph = card('Graph');
    const wrap = el('div','plot-wrap');
    const canvas = el('canvas','plot');
    const eqBadge = el('div','eq-badge');
    wrap.append(canvas,eqBadge); graph.body.append(wrap);

    grid.append(score.root, ctrl.root, graph.root);
    root.append(grid);

    // Modal (Quarto-safe classes)
    const modalBg=el('div','lm-modal-bg'); const modal=el('div','lm-modal');
    const mh=el('div','lm-modal-header'); const mhTitle=el('h4'); mhTitle.textContent='Round result'; const mhCele=el('div','celebrate'); mh.append(mhTitle,mhCele);
    const mb=el('div','lm-modal-body'); const rEq=row('Equation:'), rMoves=row('Moves used:'), rPts=row('Points earned:'), rLives=row('Lives left:'); mb.append(rEq.wrap,rMoves.wrap,rPts.wrap,rLives.wrap);
    const ma=el('div','lm-modal-actions'); const mNext=button('Next line','btn'), mClose=button('Close','btn btn-ghost'), mReset=button('New game','btn btn-danger'); ma.append(mNext,mClose,mReset);
    modal.append(mh,mb,ma); modalBg.append(modal); document.body.append(modalBg);

    // --- Drawing
    let raf=null; const M={left:40,right:40,top:64,bottom:40};
    function worldToPix(x,y,W,H){ const innerW=W-M.left-M.right, innerH=H-M.top-M.bottom; const sx=innerW/(state.xmax-state.xmin), sy=innerH/(state.ymax-state.ymin); const px=M.left+(x-state.xmin)*sx; const py=M.top+innerH-(y-state.ymin)*sy; return [px,py]; }
    function sizeForDPR(c,w,h){ const dpr=window.devicePixelRatio||1; c.style.height=h+'px'; c.style.width=w+'px'; c.width=Math.max(1,Math.floor(w*dpr)); c.height=Math.max(1,Math.floor(h*dpr)); const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return ctx; }
    function draw(){
      const W=Math.max(1, Math.floor(wrap.getBoundingClientRect().width || root.clientWidth || 300));
      if(W<10){ schedule(); return; }
      const H=W; const ctx=sizeForDPR(canvas,W,H); ctx.clearRect(0,0,W,H);
      const gridCol=getCSS('--grid'), axisCol=getCSS('--axis'), targetCol=getCSS('--target'), playerCol=getCSS('--player');
      // Grid
      ctx.lineWidth=1; ctx.strokeStyle=gridCol;
      for(let x=Math.ceil(state.xmin); x<=Math.floor(state.xmax); x++){
        const [px0,py0]=worldToPix(x,state.ymin,W,H); const [px1,py1]=worldToPix(x,state.ymax,W,H); const X=Math.round(px0)+0.5; ctx.beginPath(); ctx.moveTo(X,py0); ctx.lineTo(X,py1); ctx.stroke();
      }
      for(let y=Math.ceil(state.ymin); y<=Math.floor(state.ymax); y++){
        const [px0,py0]=worldToPix(state.xmin,y,W,H); const [px1,py1]=worldToPix(state.xmax,y,W,H); const Y=Math.round(py0)+0.5; ctx.beginPath(); ctx.moveTo(px0,Y); ctx.lineTo(px1,Y); ctx.stroke();
      }
      // Axes
      ctx.strokeStyle=axisCol; ctx.lineWidth=1.8; const [xL,y0]=worldToPix(state.xmin,0,W,H); const [xR]=worldToPix(state.xmax,0,W,H); const yAxisPx=Math.round(y0)+0.5; ctx.beginPath(); ctx.moveTo(xL,yAxisPx); ctx.lineTo(xR,yAxisPx); ctx.stroke(); const [x0,yB]=worldToPix(0,state.ymin,W,H); const [,yT]=worldToPix(0,state.ymax,W,H); const xAxisPx=Math.round(x0)+0.5; ctx.beginPath(); ctx.moveTo(xAxisPx,yB); ctx.lineTo(xAxisPx,yT); ctx.stroke();
      // Ticks
      ctx.fillStyle='#475569'; ctx.font='12px system-ui'; ctx.strokeStyle='#cbd5e1';
      for(let x=Math.ceil(state.xmin); x<=Math.floor(state.xmax); x++){ const [px]=worldToPix(x,0,W,H); const X=Math.round(px)+0.5; ctx.beginPath(); ctx.moveTo(X,yAxisPx-5); ctx.lineTo(X,yAxisPx+5); ctx.stroke(); if(x!==0) ctx.fillText(String(x), X-4, yAxisPx+16); }
      for(let y=Math.ceil(state.ymin); y<=Math.floor(state.ymax); y++){ const [,py]=worldToPix(0,y,W,H); const Y=Math.round(py)+0.5; ctx.beginPath(); ctx.moveTo(xAxisPx-5,Y); ctx.lineTo(xAxisPx+5,Y); ctx.stroke(); if(y!==0) ctx.fillText(String(y), xAxisPx+8, Y+4); }
      // Line with halo helper
      function lineWithHalo(m,b,color,width){ const pts=[]; const xMin=state.xmin,xMax=state.xmax,yMin=state.ymin,yMax=state.ymax; const yL=m*xMin+b, yR=m*xMax+b; add(xMin,yL); add(xMax,yR); if(Math.abs(m)>1e-12){ add((yMin-b)/m,yMin); add((yMax-b)/m,yMax); } function add(x,y){ if(x>=xMin-1e-9&&x<=xMax+1e-9&&y>=yMin-1e-9&&y<=yMax+1e-9) pts.push([x,y]); } if(pts.length<2) return; const [x1,y1]=worldToPix(pts[0][0],pts[0][1],W,H); const [x2,y2]=worldToPix(pts[1][0],pts[1][1],W,H); ctx.save(); ctx.lineWidth=width+3; ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.lineWidth=width; ctx.strokeStyle=color; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore(); }
      // Target & player lines
      lineWithHalo(slopeFromFrac(state.tdy,state.tdx), state.tb, targetCol, 3);
      if(state.mSet && state.bSet){ const pulsing = state.pulse && (performance.now()-state.pulse.start < state.pulse.dur); if(pulsing) lineWithHalo(currentM(), currentB(), 'rgba(16,185,129,0.55)', 7); lineWithHalo(currentM(), currentB(), playerCol, 3.5); }
      // Equation badge
      eqBadge.textContent = (state.mSet && state.bSet) ? `y = ${fracStr(state.mFrac.n,state.mFrac.d)}x ${fmtB(state.b)}` : 'y = ?x ? ?';
      if( (state.animM && !animDone(state.animM)) || (state.animB && !animDone(state.animB)) || (state.pulse && performance.now()-state.pulse.start < state.pulse.dur) ) schedule();
    }
    function schedule(){ if(raf) return; raf=requestAnimationFrame(()=>{ raf=null; draw(); }); }
    function startAnimM(from,to,dur=300){ state.animM={from,to,start:performance.now(),dur}; schedule(); }
    function startAnimB(from,to,dur=300){ state.animB={from,to,start:performance.now(),dur}; schedule(); }
    function ease(t){ return t<.5 ? 2*t*t : -1+(4-2*t)*t; }
    function animValue(a){ const t=Math.min(1,(performance.now()-a.start)/a.dur); const e=ease(t); return a.from + (a.to-a.from)*e; }
    function animDone(a){ return (performance.now()-a.start) >= a.dur; }
    function currentM(){ return state.animM ? animValue(state.animM) : state.m; }
    function currentB(){ return state.animB ? animValue(state.animB) : state.b; }

    // --- Math helpers
    function toInt(x,d){ const n=parseInt(x,10); return Number.isFinite(n)?n:d; }
    function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a||1; }
    function simplify(n,d){ if(d===0) return {n:1,d:0}; if(d<0){ n=-n; d=-d; } const g=gcd(n,d); return {n:n/g,d:d/g}; }
    function fracStr(n,d){ const s=simplify(n,d); return s.d===1? String(s.n) : `(${s.n}/${s.d})`; }
    function slopeFromFrac(n,d){ return d===0?Infinity:n/d; }
    function decimalToFrac(x,maxDen=100){ const s=Math.sign(x); const ax=Math.abs(x); const num=Math.round(ax*maxDen); const g=gcd(num,maxDen); const r=simplify(s*num/g,maxDen/g); return r; }
    function parseSlope(str){ const raw=(str||'').trim(); if(!raw) return null; if(raw.includes('/')){ const parts=raw.split('/'); if(parts.length!==2) return null; const a=parseInt(parts[0],10), b=parseInt(parts[1],10); if(!Number.isFinite(a)||!Number.isFinite(b)||b===0) return null; const s=simplify(a,b); return {m:slopeFromFrac(s.n,s.d), frac:s}; } const m=Number(raw); if(Number.isFinite(m)){ return {m, frac:decimalToFrac(m,100)}; } return null; }
    function fmtB(b){ return `${b>=0?'+':'−'} ${Math.abs(b)}`; }

    // --- Target generation & game logic
    function randint(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
    function newTarget(){
      if(state.lives<=0){ return; }
      const xmin=state.xmin, xmax=state.xmax, ymin=state.ymin, ymax=state.ymax;
      function fits(m,b){ const yL=m*xmin+b, yR=m*xmax+b; const xB=Math.abs(m)<1e-12?Infinity:(ymin-b)/m; const xT=Math.abs(m)<1e-12?Infinity:(ymax-b)/m; const cond1=(yL>=ymin&&yL<=ymax)||(yR>=ymin&&yR<=ymax); const cond2=(xB>=xmin&&xB<=xmax)||(xT>=xmin&&xT<=xmax); return cond1||cond2; }
      let tries=0; do{ state.tb = randint(-8,8); let dx=randint(1,6), dy=randint(-6,6); while(dy===0) dy=randint(-6,6); const s=simplify(dy,dx); state.tdy=Math.max(-8,Math.min(8,s.n)); state.tdx=Math.max(1,Math.min(8,s.d)); tries++; } while(tries<50 && !fits(slopeFromFrac(state.tdy,state.tdx), state.tb));
      state.moves=0; state.mSet=false; state.bSet=false; state.pulse=null; state.animM=null; state.animB=null; slopeField.input.value=''; bField.input.value=''; setControlsEnabled(true); updateUI(); schedule();
    }
    function isMatch(){ const tm=slopeFromFrac(state.tdy,state.tdx); return state.mSet && state.bSet && Math.abs(state.m - tm) < 1e-9 && state.b===state.tb; }
    function updateUI(){ pillMoves.lastChild.textContent = `${state.moves}/${maxMoves}`; pillLives.lastChild.textContent = `${state.lives}`; pillScore.lastChild.textContent = `${state.score}`; }

    function showModal(success, points){
      mhTitle.textContent = success ? 'You nailed it!' : (state.lives>0 ? 'Out of moves' : 'Game Over');
      mhCele.textContent = success ? '✨🏆' : (state.lives>0 ? '😬⏳' : '💥');
      const mT=fracStr(state.tdy,state.tdx); const eqTarget=`y = ${mT}x ${fmtB(state.tb)}`; const eqPlayer=(state.mSet&&state.bSet)?`y = ${fracStr(state.mFrac.n,state.mFrac.d)}x ${fmtB(state.b)}`:'—';
      rEq.val.textContent = success ? `Your answer: ${eqPlayer}` : `Oh no! You ran out of moves. The equation was ${eqTarget}`;
      rMoves.val.textContent=String(state.moves);
      rPts.val.textContent=success?String(points):'0';
      rLives.val.textContent=String(state.lives);
      modalBg.style.display='flex';
      mNext.style.display = state.lives>0 ? '' : 'none';
      mReset.style.display = '';
      mNext.onclick = ()=>{ modalBg.style.display='none'; newTarget(); };
      mClose.onclick = ()=>{ modalBg.style.display='none'; };
      mReset.onclick = ()=>{ state.score=0; state.lives=maxLives; modalBg.style.display='none'; newTarget(); };
    }

    // --- Actions
    function commitBoth(){
      if(state.lives<=0) return; // stop on game over
      const mP = parseSlope(slopeField.input.value);
      const bVal = parseInt(bField.input.value,10);
      if(!mP || !Number.isFinite(bVal)) return;
      const newM=mP.m, newFrac=mP.frac||decimalToFrac(mP.m,100);
      const fromM = state.mSet? state.m : newM; const fromB = state.bSet? state.b : bVal;
      state.m=newM; state.mFrac=newFrac; state.mSet=true; startAnimM(fromM,newM,320);
      state.b=bVal; state.bSet=true; startAnimB(fromB,bVal,320);
      if(state.moves<maxMoves) state.moves += 1; updateUI();
      setTimeout(()=>{
        if(isMatch()){
          state.pulse = { start: performance.now(), dur: 900 }; schedule();
          const points = Math.max(0, maxMoves - state.moves);
          state.score += points; updateUI();
          setTimeout(()=> showModal(true, points), 950);
        } else if(state.moves >= maxMoves){
          if(state.lives>0) state.lives -= 1; if(state.lives<0) state.lives=0; updateUI();
          if(state.lives<=0){ setControlsEnabled(false); }
          showModal(false, 0);
        }
      }, 340);
    }

    apply.addEventListener('click', commitBoth);
    slopeField.input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); commitBoth(); }});
    bField.input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); commitBoth(); }});
    newBtn.addEventListener('click', ()=>{ state.score=0; state.lives=maxLives; newTarget(); });

    // Responsive sizing for Quarto
    const ro = new ResizeObserver(()=>{ schedule(); });
    ro.observe(wrap);
    window.addEventListener('resize', schedule);
    newTarget();

    // --- Dev tests
    try{
      console.assert(JSON.stringify(simplify(6,8))==='{"n":3,"d":4}','simplify 6/8');
      console.assert(JSON.stringify(simplify(-6,-8))==='{"n":3,"d":4}','simplify -6/-8');
      console.assert(JSON.stringify(decimalToFrac(1.5,10))==='{"n":3,"d":2}','dec to frac 1.5');
      const p1=parseSlope('-3/2'); console.assert(p1 && p1.m===-1.5 && p1.frac.n===-3 && p1.frac.d===2,'parse -3/2');
      const p2=parseSlope('2'); console.assert(p2 && p2.m===2 && p2.frac.n===2 && p2.frac.d===1,'parse 2');
      const p3=parseSlope(' -4 / -2 '); console.assert(p3 && p3.m===2 && p3.frac.n===2 && p3.frac.d===1,'parse spaced -4/-2');
      console.assert(fmtB(3)==='+ 3' && fmtB(-3)==='− 3','fmtB signs');
      console.log('Line Match Game v5.6 tests passed');
    }catch(e){ console.warn('Tests failed',e); }

    // --- helpers
    function card(title){ const root=el('div','card'); const body=el('div','card-body'); const h=el('h3'); h.textContent=title; root.append(h,body); return {root,body}; }
    function field(labelText,inputEl){ const wrap=el('div','field'); const lab=el('label'); lab.textContent=labelText; wrap.append(lab,inputEl); return {wrap, input:inputEl}; }
    function input(type,ph,id){ const i=el('input','input'); i.type=type; i.placeholder=ph; if(id) i.id=id; return i; }
    function button(text,cls){ const b=el('button', cls||'btn'); b.textContent=text; return b; }
    function pill(k,v){ const p=el('div','pill'); const a=el('span','muted'); a.textContent=k+':'; const b=document.createElement('span'); b.textContent=v; p.append(a,b); return p; }
    function elWrap(tag,cls,child){ const n=el(tag,cls); if(child) n.append(child); return n; }
    function row(label){ const wrap=el('div','lm-row'); const l=el('div','lm-label'); l.textContent=label; const v=document.createElement('div'); wrap.append(l,v); return {wrap, val:v}; }
    function el(tag,cls){ const n=document.createElement(tag); if(cls) n.className=cls; return n; }
    function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
    function setControlsEnabled(enabled){ slopeField.input.disabled=!enabled; bField.input.disabled=!enabled; apply.disabled=!enabled; }
  }
})();
</script>
