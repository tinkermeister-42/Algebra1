<script>
window.MathJax = {
  tex: {
    packages: {'[+]': ['base', 'ams', 'color']},
    macros: {
      // right-side "step note" that does NOT use \tag
      // \hbox{} creates a zero-width box so the note does not affect alignment
      // \hskip inserts spacing to the right
      stepnote: ['\\hbox{}\\hskip 1em\\class{stepnote}{\\textcolor{gray}{\\scriptsize #1}}', 1],

      // helpers
      snboth:   ['\\stepnote{$#1$\\ \\text{both sides}}', 1],
      snplus:   ['\\snboth{+\\,#1}', 1],
      snminus:  ['\\snboth{-\\,#1}', 1],
      sntimes:  ['\\snboth{\\times\\,#1}', 1],
      sndiv:    ['\\snboth{\\div\\,#1}', 1]
    }
  }
};
</script>
