project:
  type: book
  post-render:
    - bash ./scripts/build-glossary.sh

resources:
  - glossary.json
  - scripts/*.js
  - guided_notes/Unit_*/*.html
  - guided_notes/assets/*
  # Quizzes, tests and answer keys.  Copied into the site so the book is
  # self-contained, but deliberately not linked from any page: they are
  # reachable only by typing the URL.  Built by scripts/build-assessments.py.
  - assessments/index.html
  - assessments/Unit_*/*.html
  - assessments/Unit_*/images/*
  - assessments/assets/*
  # only the assessments that exist ONLY as PDF; the builder copies those in.
  # The teacher's older PDF exports of everything else are not served - the
  # HTML prints, and those exports predate every correction since.
  - assessments/Unit_*/*.pdf

extensions:
  - glossary
  - headings
  
format:
  html:
    theme:
      - flatly
    css:
      - styles/widget-themes.css
      - styles/glossary-tooltips.css
      - styles/custom-callouts.css
      - styles/custom-general.css
    include-after-body:
      - scripts/inject-custom.html
    include-in-header: mathjax-macros.html
    html-math-method: mathjax
    mermaid:
      theme: neutral

  pdf: 
    include-in-header: macros.tex

book:
  title: "DHS Algebra 1"
  author: "Andy Ross"
  favicon: images/logo.png
  image: images/logo.png
  search: true
  
  navbar:
    search: true

  sidebar:
    search: true
    logo: images/logo.png
    collapse-level: 1
 
  chapters:
    - file: index.md
    
    - part: "Unit 1: Foundations"
