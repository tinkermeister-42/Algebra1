project:
  type: book
  post-render:
    - bash ./scripts/build-glossary.sh

resources:
  - glossary.json
  - scripts/*

extensions:
  - glossary
  - headings
  
format:
  html:
    theme:
      - flatly
    css:
      - styles/glossary-tooltips.css
      - styles/custom-callouts.css
    include-after-body:
      - scripts/inject-custom.html
    include-in-header: mathjax-macros.html
    html-math-method: mathjax
    mermaid:
      theme: neutral

  pdf: 
    include-in-header: macros.tex

book:
  title: "DHS Algebra 1"
  author: "Andy Ross"
  favicon: images/logo.png
  image: images/logo.png
  search: true
  
  navbar:
    search: true

  sidebar:
    search: true
    logo: images/logo.png
    collapse-level: 1
 
  chapters:
    - file: index.md
    
    - part: "Unit 1: Foundations"
      chapters:
        - file: chapters/Unit_1/index.qmd
        - file: chapters/Unit_1/1.1_Integers_&_Number_Lines.qmd
        - file: chapters/Unit_1/1.2_Factors_Multiples_&_Prime_Factorization.qmd
        - file: chapters/Unit_1/1.3_GCF_&_Simplifying_Fractions.qmd
        - file: chapters/Unit_1/1.4_Fractions_Decimals_&_Percents.qmd
        - file: chapters/Unit_1/1.5_Multiply_Divide_&_Compare_Fractions.qmd
        - file: chapters/Unit_1/1.6_Solving_Problems_with_Fractions_Decimals_and_Percents.qmd
        - file: chapters/Unit_1/1.7_Order_of_Operations.qmd
        - file: chapters/Unit_1/Review.qmd

    - part: "Unit 2: Algebraic Expressions"
      chapters:
        - file: chapters/Unit_2/index.qmd
        - file: chapters/Unit_2/2.1_Expressions_and_Their_Parts.qmd
        - file: chapters/Unit_2/2.2_Evaluating_Expressions.qmd
        - file: chapters/Unit_2/2.3_Combining_Like_Terms.qmd
        - file: chapters/Unit_2/2.4_The_Distributive_Property.qmd
        - file: chapters/Unit_2/2.5_Inputs_Outputs_and_Functions.qmd
        - file: chapters/Unit_2/2.6_Equivalent_Expressions.qmd
        - file: chapters/Unit_2/Review.qmd

    - part: "Unit 3: Solving Linear Equations"
      chapters:
        - file: chapters/Unit_3/index.md
        - file: chapters/Unit_3/3.1_Solving_One-Step_Equations.qmd
        - file: chapters/Unit_3/3.2_Solving_Two-Step_Equations.qmd
        - file: chapters/Unit_3/3.3_Multi-Step_Equations_with_Distribution.qmd
        - file: chapters/Unit_3/3.4_Equations_with_Variables_on_Both_Sides.qmd
        - file: chapters/Unit_3/3.5_Equations_With_No_or_Infinite_Solutions.qmd
        - file: chapters/Unit_3/3.6_Solving_Inequalities.qmd
        - file: chapters/Unit_3/3.7_Solving_Literal_Equations.qmd
        - file: chapters/Unit_3/Review.qmd

    - part: "Unit 4: Linear Functions & Graphs"

    - part: "Unit 5: Systems of Equations"

    - part: "Unit 6: Polynomials & Factoring"

    - part: "Unit 7: Quadratics"

    - part: "Unit 8: Exponential Functions"
    
    - part: "Unit 9: Statistics & Probability"

    - part: "Supplemental"
      chapters:
        - file: chapters/Supplemental/index.qmd
        - file: chapters/Supplemental/math_games_and_puzzles/index.md
        - file: chapters/Supplemental/worksheets/index.qmd
        - file: chapters/Supplemental/challenge_solutions.qmd

    - file: resources.qmd
    - file: glossary.qmd