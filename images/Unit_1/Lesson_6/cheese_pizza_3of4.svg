<svg width="260" height="260"
     viewBox="-120 -120 240 240"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Cheese pizza divided into 4 slices with 1 slice missing">

  <defs>
    <!-- Mask: white keeps, black removes -->
    <mask id="pizzaMask4">
      <rect x="-120" y="-120" width="240" height="240" fill="#ffffff"></rect>

      <!-- remove one quarter slice (0° to 90°) -->
      <path d="M0,0 L120,0 A120,120 0 0,1 0,120 Z" fill="#000000"></path>
    </mask>
  </defs>

  <g mask="url(#pizzaMask4)">

    <!-- crust -->
    <circle cx="0" cy="0" r="105"
            fill="#d9a066"
            stroke="#000000"
            stroke-width="2"></circle>

    <!-- cheese -->
    <circle cx="0" cy="0" r="95"
            fill="#f6d87a"
            stroke="#000000"
            stroke-width="2"></circle>

    <!-- slice lines (4 slices).
         Keep the two boundaries of the missing slice,
         omit the interior line. -->
    <g stroke="#000000" stroke-width="2">
      <line x1="0" y1="0" x2="105" y2="0"></line>   <!-- 0° -->
      <line x1="0" y1="0" x2="0" y2="105"></line>   <!-- 90° -->
      <line x1="0" y1="0" x2="-105" y2="0"></line>  <!-- 180° -->
      <line x1="0" y1="0" x2="0" y2="-105"></line>  <!-- 270° -->
    </g>

  </g>

</svg>
