<svg width="260" height="260" viewBox="-120 -120 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cheese pizza divided into 6 slices with 2 slices missing">

  <defs>
    <mask id="pizzaMask6">
      <!-- white keeps -->
      <rect x="-120" y="-120" width="240" height="240" fill="white"></rect>

      <!-- black removes: ONE wedge from 0° to 120° (two of six slices) -->
      <path d="M0,0 L120,0 A120,120 0 0,1 -60,103.923 Z" fill="black"></path>
    </mask>
  </defs>

  <g mask="url(#pizzaMask6)">
    <!-- crust -->
    <circle cx="0" cy="0" r="105" fill="#d9a066" stroke="#000" stroke-width="2"></circle>

    <!-- cheese -->
    <circle cx="0" cy="0" r="95" fill="#f6d87a" stroke="#000" stroke-width="2"></circle>

    <!-- slice lines (6 slices). Omit the 60° line inside the missing region.
         Keep 0° and 120° boundaries, plus the other four slice lines. -->
    <g stroke="#000" stroke-width="2">
      <line x1="0" y1="0" x2="105" y2="0"></line>            <!-- 0° -->
      <line x1="0" y1="0" x2="52.5" y2="90.933"></line>      <!-- 60° (omit if you want missing region as one gap) -->
      <line x1="0" y1="0" x2="-52.5" y2="90.933"></line>     <!-- 120° -->
      <line x1="0" y1="0" x2="-105" y2="0"></line>           <!-- 180° -->
      <line x1="0" y1="0" x2="-52.5" y2="-90.933"></line>    <!-- 240° -->
      <line x1="0" y1="0" x2="52.5" y2="-90.933"></line>     <!-- 300° -->
    </g>
  </g>

</svg>