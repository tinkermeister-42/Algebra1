<svg width="260" height="260"
     viewBox="-120 -120 240 240"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Cheese pizza divided into 12 slices with 3 slices eaten">

  <!-- crust -->
  <circle cx="0" cy="0" r="105"
          fill="#d9a066" stroke="#000000" stroke-width="2"></circle>

  <!-- cheese -->
  <circle cx="0" cy="0" r="95"
          fill="#f6d87a" stroke="#000000" stroke-width="2"></circle>

  <!-- eaten slices overlay (0° to 90° = 3 slices), drawn first so lines stay visible -->
  <path d="M0,0 L105,0 A105,105 0 0,1 0,105 Z"
        fill="#ffffff"
        opacity="0.8"></path>

  <!-- original 4ths (solid) -->
  <g stroke="#000000" stroke-width="2">
    <line x1="0" y1="0" x2="105" y2="0"></line>   <!-- 0° -->
    <line x1="0" y1="0" x2="0" y2="105"></line>   <!-- 90° -->
    <line x1="0" y1="0" x2="-105" y2="0"></line>  <!-- 180° -->
    <line x1="0" y1="0" x2="0" y2="-105"></line>  <!-- 270° -->
  </g>

  <!-- refinement cuts to make 12ths (light dashed, everywhere) -->
  <g stroke="#000000"
     stroke-width="2"
     stroke-dasharray="4 6"
     opacity="0.45">

    <!-- inside the eaten quadrant -->
    <line x1="0" y1="0" x2="90.933" y2="52.5"></line>      <!-- 30° -->
    <line x1="0" y1="0" x2="52.5" y2="90.933"></line>      <!-- 60° -->

    <!-- rest of the circle -->
    <line x1="0" y1="0" x2="-52.5" y2="90.933"></line>     <!-- 120° -->
    <line x1="0" y1="0" x2="-90.933" y2="52.5"></line>     <!-- 150° -->
    <line x1="0" y1="0" x2="-90.933" y2="-52.5"></line>    <!-- 210° -->
    <line x1="0" y1="0" x2="-52.5" y2="-90.933"></line>    <!-- 240° -->
    <line x1="0" y1="0" x2="52.5" y2="-90.933"></line>     <!-- 300° -->
    <line x1="0" y1="0" x2="90.933" y2="-52.5"></line>     <!-- 330° -->
  </g>

</svg>
