<svg width="260" height="260"
     viewBox="-120 -120 240 240"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Pepperoni pizza divided into 3 slices with 1 slice missing">

  <defs>
    <!-- Mask: white keeps, black removes -->
    <mask id="pizzaMask3">
      <rect x="-120" y="-120" width="240" height="240" fill="#ffffff"></rect>

      <!-- remove one third (0° to 120°) -->
      <path d="M0,0 L120,0 A120,120 0 0,1 -60,103.923 Z" fill="#000000"></path>
    </mask>
  </defs>

  <g mask="url(#pizzaMask3)">

    <!-- crust -->
    <circle cx="0" cy="0" r="105" fill="#d9a066" stroke="#000000" stroke-width="2"></circle>

    <!-- cheese -->
    <circle cx="0" cy="0" r="95" fill="#f6d87a" stroke="#000000" stroke-width="2"></circle>

    <!-- pepperoni -->
    <g fill="#b22222" stroke="#7a1414" stroke-width="1">
      <circle cx="-55" cy="-35" r="8"></circle>
      <circle cx="-20" cy="-55" r="8"></circle>
      <circle cx="20" cy="-45" r="8"></circle>
      <circle cx="55" cy="-20" r="8"></circle>

      <circle cx="-65" cy="5" r="8"></circle>
      <circle cx="-25" cy="0" r="8"></circle>
      <circle cx="15" cy="15" r="8"></circle>
      <circle cx="55" cy="35" r="8"></circle>

      <circle cx="-35" cy="55" r="8"></circle>
      <circle cx="0" cy="60" r="8"></circle>
      <circle cx="30" cy="55" r="8"></circle>

      <circle cx="0" cy="-10" r="8"></circle>
    </g>

    <!-- slice lines (3 slices). Keep the two boundaries of the missing wedge. -->
    <g stroke="#000000" stroke-width="2">
      <line x1="0" y1="0" x2="105" y2="0"></line>         <!-- 0° boundary -->
      <line x1="0" y1="0" x2="-52.5" y2="90.933"></line>  <!-- 120° boundary -->
      <line x1="0" y1="0" x2="-52.5" y2="-90.933"></line> <!-- 240° boundary -->
    </g>

  </g>

</svg>
