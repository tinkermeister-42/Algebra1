<svg width="260" height="260" viewBox="-120 -120 240 240"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Pepperoni pizza divided into 8 slices with 1 slice shaded">

  <!-- crust -->
  <circle cx="0" cy="0" r="105" fill="#d9a066" stroke="#000" stroke-width="2"></circle>

  <!-- cheese -->
  <circle cx="0" cy="0" r="95" fill="#f6d87a" stroke="#000" stroke-width="2"></circle>

  <!-- pepperoni -->
  <g fill="#b22222" stroke="#7a1414" stroke-width="1">
    <circle cx="0" cy="-75" r="7"></circle>
    <circle cx="35" cy="-70" r="8"></circle>
    <circle cx="-40" cy="-68" r="7"></circle>

    <circle cx="65" cy="-35" r="8"></circle>
    <circle cx="25" cy="-40" r="7"></circle>
    <circle cx="-20" cy="-38" r="8"></circle>
    <circle cx="-65" cy="-30" r="7"></circle>

    <circle cx="75" cy="0" r="8"></circle>
    <circle cx="40" cy="5" r="7"></circle>
    <circle cx="-35" cy="8" r="7"></circle>
    <circle cx="-75" cy="0" r="8"></circle>

    <circle cx="60" cy="40" r="7"></circle>
    <circle cx="20" cy="45" r="8"></circle>
    <circle cx="-20" cy="42" r="7"></circle>
    <circle cx="-60" cy="38" r="8"></circle>

    <circle cx="35" cy="75" r="7"></circle>
    <circle cx="-35" cy="72" r="8"></circle>
  </g>

  <!-- shaded slice (overlay on top so it also covers pepperoni) -->
  <path d="M0,0 L105,0 A105,105 0 0,1 74.246,74.246 Z"
        fill="#ffffff"
        opacity="0.8"></path>

  <!-- erase crust outline on shaded slice (so the crust arc doesn't show through) -->
  <path d="M105,0 A105,105 0 0,1 74.246,74.246"
        fill="none"
        stroke="#ffffff"
        stroke-width="6"
        opacity="0.8"></path>

  <!-- slice lines (on top) -->
  <g stroke="#000" stroke-width="2">
    <line x1="0" y1="0" x2="105" y2="0"></line>
    <line x1="0" y1="0" x2="74.246" y2="74.246"></line>
    <line x1="0" y1="0" x2="0" y2="105"></line>
    <line x1="0" y1="0" x2="-74.246" y2="74.246"></line>
    <line x1="0" y1="0" x2="-105" y2="0"></line>
    <line x1="0" y1="0" x2="-74.246" y2="-74.246"></line>
    <line x1="0" y1="0" x2="0" y2="-105"></line>
    <line x1="0" y1="0" x2="74.246" y2="-74.246"></line>
  </g>

</svg>
