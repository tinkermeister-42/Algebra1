<svg width="260" height="260"
     viewBox="-120 -120 240 240"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Pepperoni pizza divided into 3 slices with 1 slice eaten">

  <!-- crust -->
  <circle cx="0" cy="0" r="105"
          fill="#d9a066" stroke="#000000" stroke-width="2"></circle>

  <!-- cheese -->
  <circle cx="0" cy="0" r="95"
          fill="#f6d87a" stroke="#000000" stroke-width="2"></circle>

  <!-- pepperoni -->
  <g fill="#b22222" stroke="#7a1414" stroke-width="1">
    <circle cx="-55" cy="-35" r="8"></circle>
    <circle cx="-20" cy="-55" r="8"></circle>
    <circle cx="20" cy="-45" r="8"></circle>
    <circle cx="55" cy="-20" r="8"></circle>

    <circle cx="-65" cy="5" r="8"></circle>
    <circle cx="-25" cy="0" r="8"></circle>
    <circle cx="15" cy="15" r="8"></circle>
    <circle cx="55" cy="35" r="8"></circle>

    <circle cx="-35" cy="55" r="8"></circle>
    <circle cx="0" cy="60" r="8"></circle>
    <circle cx="30" cy="55" r="8"></circle>

    <circle cx="0" cy="-10" r="8"></circle>
  </g>

  <!-- eaten slice overlay: 0° to 120° (one third), drawn before lines -->
  <path d="M0,0 L105,0 A105,105 0 0,1 -52.5,90.933 Z"
        fill="#ffffff"
        opacity="0.8"></path>

  <!-- slice lines (3 slices), all visible -->
  <g stroke="#000000" stroke-width="2">
    <line x1="0" y1="0" x2="105" y2="0"></line>          <!-- 0° -->
    <line x1="0" y1="0" x2="-52.5" y2="90.933"></line>   <!-- 120° -->
    <line x1="0" y1="0" x2="-52.5" y2="-90.933"></line>  <!-- 240° -->
  </g>

</svg>
