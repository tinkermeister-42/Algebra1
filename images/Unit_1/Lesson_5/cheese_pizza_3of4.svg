<svg width="260" height="260"
     viewBox="-120 -120 240 240"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Cheese pizza divided into 4 slices with 1 slice eaten">

  <!-- crust -->
  <circle cx="0" cy="0" r="105"
          fill="#d9a066"
          stroke="#000000"
          stroke-width="2"></circle>

  <!-- cheese -->
  <circle cx="0" cy="0" r="95"
          fill="#f6d87a"
          stroke="#000000"
          stroke-width="2"></circle>

  <!-- eaten slice overlay (0° to 90°), drawn first -->
  <path d="M0,0 L105,0 A105,105 0 0,1 0,105 Z"
        fill="#ffffff"
        opacity="0.8"></path>

  <!-- slice lines (4 slices, all present) -->
  <g stroke="#000000" stroke-width="2">
    <line x1="0" y1="0" x2="105" y2="0"></line>   <!-- 0° -->
    <line x1="0" y1="0" x2="0" y2="105"></line>   <!-- 90° -->
    <line x1="0" y1="0" x2="-105" y2="0"></line>  <!-- 180° -->
    <line x1="0" y1="0" x2="0" y2="-105"></line>  <!-- 270° -->
  </g>

</svg>
